# Project-local Codex MCP configuration.
# Update GODOT_PATH when the Godot executable is installed elsewhere.

[mcp_servers.godot]
command = "npx"
args = ["-y", "@coding-solo/godot-mcp@0.1.1"]
startup_timeout_sec = 120

[mcp_servers.godot.env]
GODOT_PATH = "C:/Work/Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64.exe"
DEBUG = "true"
